<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <!-- Blokuje powiększanie strony gestem na telefonie -->
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Snowcraft</title>
  <link rel="stylesheet" href="style.css?v=12c">
</head>
<body>
  <canvas id="plansza"></canvas>
  <div id="obroc">Obróć telefon poziomo</div>

  <!-- Menu startowe (przyciski HTML na canvasie) -->
  <div id="menu">
    <h1>Snowcraft</h1>
    <button id="przyciskArena">Arena</button>
    <button id="przyciskWielka">Wielka arena</button>
    <button disabled>Kampania (wkrótce)</button>
  </div>
  <!-- Mały przycisk na ekranie końca poziomu -->
  <button id="przyciskMenu">Menu</button>

  <!-- Kolejność ma znaczenie: config jako pierwszy, game na końcu.
       ?v=... to numer wersji: zmień go przy każdym kroku, żeby telefon pobrał nowe pliki. -->
  <script src="config.js?v=12c"></script>
  <script src="obrazy.js?v=12c"></script>
  <script src="draw.js?v=12c"></script>
  <script src="input.js?v=12c"></script>
  <script src="ai.js?v=12c"></script>
  <script src="przeszkody.js?v=12c"></script>
  <script src="bonusy.js?v=12c"></script>
  <script src="stanowiska.js?v=12c"></script>
  <script src="tryby.js?v=12c"></script>
  <script src="game.js?v=12c"></script>
</body>
</html>
